[package]
name = "tools4devs"
version = "4.0.0"
description = "Desktop toolkit for local media, image, PDF and developer workflows"
authors = ["Mirha"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tools4devs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
sha2 = "0.10"
wasapi = "0.24.0"
hound = "3.5.1"
tauri-plugin-opener = "2.5.5"
sevenz-rust2 = "0.7.0"
windows = { version = "0.61.3", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.3.5"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
