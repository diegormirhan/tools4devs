<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Rendered at 1920x1080 by headless Chrome. Expects beside it: cover.png,
     tools4devs-mark.svg, wordmark-dark.svg and inter-tight-{400,500,600}.woff2 (see SKILL.md). -->
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 400; src: url("inter-tight-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 500; src: url("inter-tight-500.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 600; src: url("inter-tight-600.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  html { background: #0a0e14; }
  body {
    position: relative; color: #f4f7fb; font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 700px at 78% 30%, rgba(91, 192, 235, .22), transparent 70%),
      radial-gradient(700px 600px at 10% 100%, rgba(99, 102, 241, .20), transparent 70%),
      #0a0e14;
  }
  /* The dot grid of the app's card artwork, fading out before the shot. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0 / 28px 28px;
    mask-image: linear-gradient(90deg, #000 0%, transparent 60%);
  }
  .copy { position: absolute; left: 110px; top: 170px; width: 820px; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 600; letter-spacing: -.02em; }
  .brand__mark { width: 72px; height: 72px; }
  .brand__wordmark { width: 260px; height: auto; }
  h1 { margin-top: 64px; font-size: 92px; line-height: .98; font-weight: 600; letter-spacing: -.045em; }
  h1 span { color: #5bc0eb; }
  .sub { margin-top: 40px; font-size: 36px; line-height: 1.3; color: #a9b4c2; font-weight: 400; }
  .pills { position: absolute; left: 110px; bottom: 120px; display: flex; gap: 16px; }
  .pill { padding: 14px 26px; border-radius: 999px; font-size: 26px; font-weight: 500;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #dfe6ee; }
  .pill b { color: #5bc0eb; font-weight: 600; }
  /* The app, bleeding off the right edge and turned slightly away. */
  .shot {
    position: absolute; left: 930px; top: 170px; width: 1320px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 60px 120px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(91,192,235,.10);
    transform: perspective(2200px) rotateY(-14deg) rotateX(4deg); transform-origin: left center;
  }
  .play {
    position: absolute; left: 1430px; top: 330px; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(91,192,235,.95); display: grid; place-items: center;
    box-shadow: 0 20px 60px rgba(91,192,235,.45), 0 0 0 14px rgba(91,192,235,.18);
  }
  .play::after { content: ""; margin-left: 12px; border-left: 46px solid #0a0e14; border-top: 28px solid transparent; border-bottom: 28px solid transparent; }
</style>
</head>
<body>
  <img class="shot" src="cover.png" alt="">
  <div class="play"></div>
  <div class="copy">
    <div class="brand"><img class="brand__mark" src="tools4devs-mark.svg" alt=""><img class="brand__wordmark" src="wordmark-dark.svg" alt="tools4devs"></div>
    <h1>Mais de 100 ferramentas.<br><span>Zero linha de comando.</span></h1>
    <p class="sub">Converta vídeos, edite PDFs, gere CSS, QR codes e mockups. Tudo local, grátis e open source.</p>
  </div>
  <div class="pills">
    <span class="pill"><b>25</b> ferramentas open source</span>
    <span class="pill"><b>90</b> utilitários</span>
    <span class="pill">Windows</span>
  </div>
</body>
</html>
