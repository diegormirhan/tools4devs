<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Miniatura social 1280x640. Ao lado: cover.png, tools4devs-mark.svg, wordmark-dark.svg, inter-tight-{400,500,600}.woff2 -->
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 400; src: url("inter-tight-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 500; src: url("inter-tight-500.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 600; src: url("inter-tight-600.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  html { background: #0a0e14; }
  body {
    position: relative; color: #f4f7fb; font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(600px 460px at 78% 30%, rgba(91,192,235,.22), transparent 70%),
      radial-gradient(470px 400px at 10% 100%, rgba(99,102,241,.20), transparent 70%),
      #0a0e14;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0 / 20px 20px;
    mask-image: linear-gradient(90deg, #000 0%, transparent 60%);
  }
  .copy { position: absolute; left: 64px; top: 50px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand__mark { width: 50px; height: 50px; }
  .brand__wordmark { width: 178px; height: auto; }
  h1 { margin-top: 38px; font-size: 66px; line-height: .98; font-weight: 600; letter-spacing: -.045em; }
  h1 span { color: #5bc0eb; }
  .sub { margin-top: 24px; font-size: 24px; line-height: 1.3; color: #a9b4c2; font-weight: 400; width: 520px; }
  .pills { position: absolute; left: 64px; bottom: 44px; display: flex; gap: 10px; }
  .pill { padding: 9px 18px; border-radius: 999px; font-size: 18px; font-weight: 500;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #dfe6ee; }
  .pill b { color: #5bc0eb; font-weight: 600; }
  .shot {
    position: absolute; left: 620px; top: 112px; width: 880px; border-radius: 15px;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(91,192,235,.10);
    transform: perspective(1470px) rotateY(-14deg) rotateX(4deg); transform-origin: left center;
  }
  .play {
    position: absolute; left: 953px; top: 200px; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(91,192,235,.95); display: grid; place-items: center;
    box-shadow: 0 14px 40px rgba(91,192,235,.45), 0 0 0 9px rgba(91,192,235,.18);
  }
  .play::after { content: ""; margin-left: 8px; border-left: 31px solid #0a0e14; border-top: 19px solid transparent; border-bottom: 19px solid transparent; }
</style>
</head>
<body>
  <img class="shot" src="cover.png" alt="">
  <div class="play"></div>
  <div class="copy">
    <div class="brand"><img class="brand__mark" src="tools4devs-mark.svg" alt=""><img class="brand__wordmark" src="wordmark-dark.svg" alt="tools4devs"></div>
    <h1>Mais de 100 ferramentas.<br><span>Zero linha de comando.</span></h1>
    <p class="sub">Converta vídeos, edite PDFs, gere CSS, QR codes e mockups. Tudo local, grátis e open source.</p>
  </div>
  <div class="pills">
    <span class="pill"><b>25</b> ferramentas open source</span>
    <span class="pill"><b>90</b> utilitários</span>
    <span class="pill">Windows</span>
  </div>
</body>
</html>
