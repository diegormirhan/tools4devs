<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Preview clip</title>
<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Fraunces Variable";src:url(../fonts/fraunces.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:640px;height:360px;overflow:hidden;background:#000}
#stage{position:relative;width:640px;height:360px;overflow:hidden;background:var(--bg);font-family:"Inter Variable",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute;left:50%;top:50%;will-change:transform}
.card{background:var(--panel);color:var(--ink);border-radius:16px;box-shadow:0 18px 40px -12px rgb(0 0 0/.45),0 2px 0 rgb(255 255 255/.5) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card small{font:500 11px "JBM",monospace;letter-spacing:.04em;opacity:.7}
.pill{background:var(--acc);color:var(--bg);font-weight:700;font-size:15px;border-radius:99px;padding:6px 14px;white-space:nowrap}
.tag{position:absolute;left:26px;top:20px;font:500 11px "JBM",monospace;letter-spacing:.14em;color:var(--acc);opacity:.95}
.capbox{position:absolute;left:26px;bottom:22px;height:44px;width:420px;overflow:hidden}
.cap{position:absolute;left:0;top:0;font:600 34px/44px "Fraunces Variable",Georgia,serif;letter-spacing:-.02em;white-space:nowrap}
.dots{position:absolute;right:26px;bottom:30px;display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.25}
.wipe{position:absolute;inset:0;background:var(--acc);z-index:20}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"JBM",monospace}
.track{background:rgb(255 255 255/.16);border-radius:99px;overflow:hidden}.fill{background:var(--acc);height:100%;border-radius:99px}
</style></head><body><div id="stage"></div>
<script>
const ID = new URLSearchParams(location.search).get("id");
const HUE = { ffmpeg: 255, qpdf: 285, jq: 322, qr: 215 }[ID];
const D = 6; // seconds; every clip is a seamless 6 s loop
const stage = document.getElementById("stage");
stage.style.cssText = `--bg:oklch(0.27 0.09 ${HUE});--panel:oklch(0.985 0.006 ${HUE});--ink:oklch(0.26 0.06 ${HUE});--acc:oklch(0.82 0.14 ${HUE});--soft:oklch(0.4 0.1 ${HUE});--line:oklch(0.88 0.03 ${HUE})`;

/* ---- tiny motion toolkit ---- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: (x) => 1 - Math.pow(1 - x, 3), inout: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, lin: (x) => x };
const lerp = (a, b, k) => a + (b - a) * k;
const ic = (name, size = 24, extra = "") => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" style="${extra}">${(window.ICONS[name] || "")}</svg>`;
function mk(html = "", cls = "abs", css = "", parent = stage) { const d = document.createElement("div"); d.className = cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d; }
// put(): position relative to the stage centre, with optional rotate/scale/opacity
function put(el, { x = 0, y = 0, r = 0, s = 1, sx = s, sy = s, o = 1 } = {}) {
  el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${r}deg) scale(${sx}, ${sy})`; el.style.opacity = o;
}
const CAPS = { ffmpeg: ["Convert.", "Compress.", "Trim."], qpdf: ["Merge.", "Split.", "Rotate."], jq: ["Format.", "Query.", "Validate."], qr: ["Encode.", "Style.", "Save."] }[ID];
const TAG = { ffmpeg: "FFMPEG", qpdf: "QPDF", jq: "JQ", qr: "QR CODES" }[ID];
const SW = [2.1, 4.2]; // scene switch times (hidden behind the wipes)
mk(TAG, "tag", "", stage);
const capbox = mk("", "capbox", "", stage);
const capEls = CAPS.map((c) => mk(c, "cap", "", capbox));
const dots = mk("<i></i><i></i><i></i>", "dots", "", stage);
const wipes = [mk("", "wipe", "", stage), mk("", "wipe", "", stage)];
const scene = (t) => (t < SW[0] ? 0 : t < SW[1] ? 1 : 2);
function chrome(t) {
  const sc = scene(t), starts = [0, 2.1, 4.2], ends = [2.0, 4.1, 5.95];
  capEls.forEach((c, i) => {
    const a = seg(t, starts[i] + 0.08, starts[i] + 0.45), b = seg(t, ends[i] - 0.15, ends[i]);
    c.style.transform = `translateY(${(1 - E.out(a)) * 100 - E.inout(b) * 100}%)`;
  });
  [...dots.children].forEach((d, i) => (d.style.opacity = i === sc ? 1 : .25));
  // wipes cover the frame, switch scenes behind them, then uncover
  [[1.86, 2.36], [3.96, 4.46]].forEach(([a, b], i) => {
    const m = (a + b) / 2, w = wipes[i];
    w.style.display = t >= a && t <= b ? "block" : "none";
    w.style.transform = t < m ? `translateX(${-100 + E.inout(seg(t, a, m)) * 100}%)` : `translateX(${E.inout(seg(t, m, b)) * 100}%)`;
  });
}
const groups = [0, 1, 2].map(() => mk("", "abs", "inset:0;left:0;top:0;width:640px;height:360px;transform:none", stage));
groups.forEach((g) => (g.style.left = "0", g.style.top = "0"));
// children are centred on the stage centre: give each group a centred origin box
groups.forEach((g) => { g.style.cssText = "position:absolute;left:0;top:0;width:640px;height:360px"; });
const G = (i) => groups[i];
// mk into a group but keeping .abs centring relative to the stage centre
const inG = (i, html, css = "") => mk(html, "abs", css, groups[i]);
const exit = (t, a, b) => E.inout(seg(t, a, b)); // 0→1

/* ---- clips ---- */
const CLIPS = {};

CLIPS.ffmpeg = () => {
  const chipCss = "width:150px;height:108px";
  const A = inG(0, `<div class="card" style="${chipCss}">${ic("file-video", 34, "color:var(--soft)")}<b style="font-size:13px">holiday.mov</b><small>.MOV · 1.2 GB</small></div>`);
  const arrow = inG(0, `<svg width="80" height="20" viewBox="0 0 80 20" style="overflow:visible"><path id="ar" d="M2 10 H72 M62 2 L74 10 L62 18" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="120"/></svg>`);
  const bars = Array.from({ length: 9 }, () => '<i style="display:block;width:5px;height:6px;border-radius:3px;background:var(--soft)"></i>').join("");
  const B = inG(0, `<div class="card" style="${chipCss}"><div class="bars" style="display:flex;gap:4px;align-items:center;height:38px">${bars}</div><b style="font-size:13px">holiday.mp3</b><small>.MP3 · 5 MB</small></div>`);
  const barEls = [...B.querySelectorAll(".bars i")];
  const num = inG(1, `<div class="num" style="font:800 78px/1 'Inter Variable';letter-spacing:-.04em">1.2 GB</div>`);
  const trackBox = inG(1, `<div class="track" style="width:300px;height:12px"><div class="fill" style="width:100%"></div></div>`);
  const fill = trackBox.querySelector(".fill");
  const off = inG(1, `<div class="pill">−80%</div>`);
  const strip = inG(2, `<div style="width:400px;height:60px;border-radius:12px;overflow:hidden;display:flex;position:relative;background:var(--panel)">${Array.from({ length: 8 }, (_, i) => `<i style="flex:1;background:oklch(${0.62 + (i % 3) * 0.08} 0.09 ${255 + i * 8})"></i>`).join("")}</div>`);
  const dimL = inG(2, `<div style="width:1px;height:60px;background:rgb(0 0 0/.55)"></div>`), dimR = inG(2, `<div style="width:1px;height:60px;background:rgb(0 0 0/.55)"></div>`);
  const hL = inG(2, `<div style="width:12px;height:76px;border-radius:5px;background:var(--acc)"></div>`), hR = inG(2, `<div style="width:12px;height:76px;border-radius:5px;background:var(--acc)"></div>`);
  const head = inG(2, `<div style="width:3px;height:88px;background:#fff;border-radius:2px"></div>`);
  const tl = inG(2, `<div class="mono" style="font-size:13px;color:var(--acc)">00:12</div>`), tr = inG(2, `<div class="mono" style="font-size:13px;color:var(--acc)">00:34</div>`);
  return (t) => {
    const s = t, xo = exit(s, 1.72, 2.0);
    put(A, { x: lerp(-270, -96, E.back(seg(s, 0.15, 0.75))) - xo * 260, r: lerp(-8, 0, E.out(seg(s, .15, .75))), o: seg(s, .12, .3) * (1 - xo) });
    document.getElementById("ar").style.strokeDashoffset = 120 * (1 - E.out(seg(s, .8, 1.15)));
    put(arrow, { x: 0, o: (1 - xo) });
    put(B, { x: lerp(270, 96, E.back(seg(s, 1.0, 1.6))) + xo * 260, r: lerp(8, 0, E.out(seg(s, 1.0, 1.6))), o: seg(s, .98, 1.15) * (1 - xo) });
    barEls.forEach((b, i) => (b.style.height = 6 + 32 * Math.abs(Math.sin(s * 7 + i * 0.85)) * seg(s, 1.2, 1.5) + "px"));
    const u = t - 2.1, vv = 1200 - 960 * E.inout(seg(u, 0.5, 1.3));
    num.firstChild.textContent = vv >= 1000 ? (vv / 1000).toFixed(1) + " GB" : Math.round(vv) + " MB";
    const xo2 = exit(u, 1.68, 1.95);
    put(num, { y: -34, s: lerp(.8, 1, E.back(seg(u, 0, .5))), o: seg(u, 0, .2) * (1 - xo2), x: -xo2 * 120 });
    fill.style.width = (vv / 1200) * 100 + "%";
    put(trackBox, { y: 46, o: seg(u, .1, .3) * (1 - xo2), x: -xo2 * 120 });
    put(off, { x: 130, y: -84, s: E.back(seg(u, 1.25, 1.6)), o: seg(u, 1.25, 1.4) * (1 - xo2), r: -6 });
    const w = t - 4.2, sO = 1 - exit(w, 1.62, 1.85);
    put(strip, { y: -6, sx: lerp(.85, 1, E.out(seg(w, .05, .5))), o: seg(w, .05, .3) * sO });
    const xl = lerp(-206, -96, E.inout(seg(w, .5, 1.0))), xr = lerp(206, 86, E.inout(seg(w, .65, 1.15)));
    put(hL, { x: xl, y: -6, o: seg(w, .4, .6) * sO }); put(hR, { x: xr, y: -6, o: seg(w, .55, .75) * sO });
    dimL.style.width = (xl + 200) + "px"; dimL.style.opacity = seg(w, .5, .8) * sO;
    dimL.style.transform = `translate(calc(-50% + ${-200 + (xl + 200) / 2}px), calc(-50% - 6px))`;
    dimR.style.width = (200 - xr) + "px"; dimR.style.transform = `translate(calc(-50% + ${xr + (200 - xr) / 2}px), calc(-50% - 6px))`; dimR.style.opacity = seg(w, .65, .95) * sO;
    dimL.firstChild.style.width = "100%"; dimR.firstChild.style.width = "100%"; dimL.firstChild.style.height = dimR.firstChild.style.height = "60px";
    dimL.firstChild.style.background = dimR.firstChild.style.background = "rgb(8 14 34/.62)";
    put(head, { x: lerp(xl + 8, xr - 8, E.inout(seg(w, 1.15, 1.7))), y: -6, o: seg(w, 1.1, 1.2) * sO });
    put(tl, { x: xl, y: 50, o: seg(w, 1.0, 1.3) * sO }); put(tr, { x: xr, y: 50, o: seg(w, 1.1, 1.4) * sO });
  };
};

const page = (l) => `<div class="card" style="width:96px;height:126px;align-items:stretch;justify-content:flex-start;padding:14px 12px;gap:7px;border-radius:10px"><b style="font:800 20px 'Inter Variable';color:var(--soft)">${l}</b>${[100, 84, 92, 60, 76].map((w) => `<i style="display:block;height:5px;border-radius:3px;background:var(--line);width:${w}%"></i>`).join("")}</div>`;
CLIPS.qpdf = () => {
  const P = ["A", "B", "C"].map((l) => inG(0, page(l)));
  const badge = inG(0, `<div class="pill">3 pages → 1</div>`);
  const S = ["1", "2", "3"].map((l) => inG(1, page(l)));
  const cuts = [0, 1].map(() => inG(1, `<div style="width:0;height:170px;border-left:3px dashed var(--acc)"></div>`));
  const scis = inG(1, ic("scissors", 30, "color:var(--acc)"));
  const R = inG(2, page("A")); const rp = inG(2, `<div class="pill">90°</div>`); const ri = inG(2, ic("rotate-cw", 34, "color:var(--acc)"));
  return (t) => {
    const s = t, xo = exit(s, 1.72, 2.0);
    const from = [[-250, -50, -14], [0, 130, 8], [250, -60, 12]], to = [[-10, 6, -3], [4, 0, 2], [18, -6, 5]];
    P.forEach((p, i) => { const k = E.back(seg(s, .1 + i * .18, .85 + i * .18)); put(p, { x: lerp(from[i][0], to[i][0] - 60, k) - 60 * xo * 0, y: lerp(from[i][1], to[i][1], k), r: lerp(from[i][2], to[i][2], k), o: seg(s, .05 + i * .18, .25 + i * .18) * (1 - xo), s: 1 - xo * .2 }); });
    put(badge, { x: 110, y: -6, s: E.back(seg(s, 1.0, 1.4)), o: seg(s, 1.0, 1.15) * (1 - xo) });
    const u = t - 2.1, xo2 = exit(u, 1.68, 1.95);
    S.forEach((p, i) => { const k = E.back(seg(u, .1 + i * .06, .8 + i * .06)); put(p, { x: lerp(i * 6, (i - 1) * 132, k), y: lerp(-i * 6, 0, k), r: lerp(i * 2, (i - 1) * 3, k), o: seg(u, 0, .12) * (1 - xo2), s: 1 - xo2 * .2 }); });
    cuts.forEach((c, i) => put(c, { x: (i - .5) * 132, o: seg(u, .75, 1.0) * (1 - xo2), sy: E.out(seg(u, .75, 1.05)) }));
    put(scis, { x: lerp(-70, 66, E.inout(seg(u, .8, 1.5))), y: -102, r: 90, o: seg(u, .8, .95) * (1 - seg(u, 1.5, 1.7)) * (1 - xo2) });
    const w = t - 4.2, sO = 1 - exit(w, 1.62, 1.85);
    put(R, { x: -40, r: lerp(0, 90, E.back(seg(w, .3, 1.0))), o: seg(w, 0, .2) * sO, s: lerp(.85, 1, E.out(seg(w, 0, .4))) });
    put(ri, { x: 96, y: -30, r: lerp(0, 360, E.inout(seg(w, .3, 1.1))), o: seg(w, .25, .4) * sO });
    put(rp, { x: 96, y: 22, s: E.back(seg(w, 1.0, 1.35)), o: seg(w, 1.0, 1.15) * sO });
  };
};

CLIPS.jq = () => {
  const win = inG(0, `<div style="width:520px;height:236px;border-radius:16px;background:oklch(0.19 0.05 ${HUE});box-shadow:0 22px 50px -14px rgb(0 0 0/.55);"><div style="display:flex;gap:6px;padding:12px 14px"><i style="width:9px;height:9px;border-radius:50%;background:oklch(0.5 0.1 25)"></i><i style="width:9px;height:9px;border-radius:50%;background:oklch(0.7 0.12 90)"></i><i style="width:9px;height:9px;border-radius:50%;background:oklch(0.65 0.13 150)"></i></div></div>`);
  const K = (s) => `<span style="color:oklch(0.8 0.12 ${HUE})">${s}</span>`, Sx = (s) => `<span style="color:oklch(0.82 0.13 160)">${s}</span>`, N = (s) => `<span style="color:oklch(0.82 0.13 60)">${s}</span>`, B = (s) => `<span style="color:oklch(0.8 0.12 20)">${s}</span>`, Pn = (s) => `<span style="opacity:.55">${s}</span>`;
  const one = inG(0, `<div class="mono" style="font-size:12.6px;white-space:nowrap;color:#fff;width:470px;overflow:hidden">${Pn("{")}${K('"id"')}${Pn(":")}${N("42")}${Pn(",")}${K('"name"')}${Pn(":")}${Sx('"Ada"')}${Pn(",")}${K('"tags"')}${Pn(":[")}${Sx('"dev"')}${Pn(",")}${Sx('"ops"')}${Pn("],")}${K('"active"')}${Pn(":")}${B("true")}${Pn("}")}</div>`);
  const lines = [[0, Pn("{")], [1, K('"id"') + Pn(": ") + N("42") + Pn(",")], [1, K('"name"') + Pn(": ") + Sx('"Ada"') + Pn(",")], [1, K('"tags"') + Pn(": [")], [2, Sx('"dev"') + Pn(",")], [2, Sx('"ops"')], [1, Pn("],")], [1, K('"active"') + Pn(": ") + B("true")], [0, Pn("}")]];
  const L = lines.map(([ind, h], i) => inG(0, `<div class="mono" style="font-size:12.6px;white-space:nowrap;color:#fff;width:440px;display:flex"><span style="width:26px;opacity:.3">${i + 1}</span><span style="padding-left:${ind * 18}px">${h}</span></div>`));
  const valid = inG(0, `<div class="pill" style="display:flex;gap:6px;align-items:center">${ic("check", 16)} valid JSON</div>`);
  const q = inG(1, `<div class="card" style="width:330px;height:46px;flex-direction:row;justify-content:flex-start;padding:0 16px;gap:10px;border-radius:12px"><b class="mono" style="color:var(--soft)">jq</b><span class="mono qtxt" style="font-size:14px"></span></div>`);
  const res = inG(1, `<div class="pill" style="font-size:17px">"dev"</div>`);
  const hi = inG(1, `<div style="width:410px;height:19px;border-radius:5px;background:oklch(0.82 0.14 ${HUE}/.3)"></div>`);
  const err = inG(2, `<div style="width:410px;height:19px;border-radius:5px" class="eb"></div>`);
  const msg = inG(2, `<div class="pill" style="display:flex;gap:6px;align-items:center" id="msg"></div>`);
  const qtxt = q.querySelector(".qtxt");
  return (t) => {
    const s = t, xo = exit(s, 1.72, 2.0);
    put(win, { y: -22, sx: lerp(.94, 1, E.out(seg(s, 0, .4))), o: seg(s, 0, .2) });
    put(one, { x: 0, y: -22 + 8, o: seg(s, .1, .2) * (1 - seg(s, 1.02, 1.2)) });
    one.firstChild.style.width = 470 * E.lin(seg(s, .15, 1.0)) + "px";
    L.forEach((l, i) => put(l, { x: 0, y: -22 - 92 + i * 21 + lerp(-8, 0, E.out(seg(s, 1.1 + i * .05, 1.35 + i * .05))) + 26, o: seg(s, 1.1 + i * .05, 1.3 + i * .05) }));
    put(valid, { x: 168, y: 62, s: E.back(seg(s, 1.62, 1.95)), o: seg(s, 1.62, 1.75) * (1 - seg(t, 2.6, 2.8)) });
    const u = t - 2.1, xo2 = exit(u, 1.68, 1.95);
    put(hi, { x: 0, y: -22 - 92 + 3 * 21 + 26 + 21 * 0, o: seg(u, .9, 1.1) * (1 - xo2) });
    qtxt.textContent = ".tags[0]".slice(0, Math.floor(8 * seg(u, .1, .7))) + (u % .6 < .3 && u < .9 ? "▌" : "");
    put(q, { y: 100, s: E.back(seg(u, 0, .4)), o: seg(u, 0, .12) * (1 - xo2) });
    put(res, { x: 126, y: 100, s: E.back(seg(u, 1.0, 1.35)), o: seg(u, 1.0, 1.12) * (1 - xo2) });
    const w = t - 4.2, sO = 1 - exit(w, 1.62, 1.85), bad = seg(w, 0, .2) * (1 - seg(w, .95, 1.1));
    err.firstChild.style.background = w < 1.0 ? `oklch(0.6 0.2 25/.42)` : `oklch(0.78 0.15 150/.35)`;
    put(err, { x: 0, y: -22 - 92 + 2 * 21 + 26, o: seg(w, .05, .2) * sO, x: w < 1.0 ? Math.sin(w * 60) * 4 * (1 - seg(w, .3, .9)) : 0 });
    document.getElementById("msg").innerHTML = w < 1.0 ? ic("triangle-alert", 16) + " line 3: unexpected token" : ic("check", 16) + " fixed";
    put(msg, { x: 130, y: 62, s: E.back(seg(w, .3, .65)), o: seg(w, .3, .45) * sO });
  };
};
// (jq keeps the code window on screen across scenes; only the overlays change)

CLIPS.qr = () => {
  const N = 21, cell = 8, seed = (() => { let a = 7; return () => (a = (a * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; })();
  const finder = (r, c) => [[0, 0], [0, N - 7], [N - 7, 0]].some(([fr, fc]) => r >= fr && r < fr + 7 && c >= fc && c < fc + 7);
  const fval = (r, c) => { const [fr, fc] = [[0, 0], [0, N - 7], [N - 7, 0]].find(([a, b]) => r >= a && r < a + 7 && c >= b && c < b + 7); const y = r - fr, x = c - fc; return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4); };
  const cells = []; const grid = inG(0, `<div style="position:relative;width:${N * cell + 32}px;height:${N * cell + 32}px;background:var(--panel);border-radius:18px;box-shadow:0 22px 50px -14px rgb(0 0 0/.55)"></div>`);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const on = finder(r, c) ? fval(r, c) : seed() > .5; if (!on) continue; const d = document.createElement("i"); d.style.cssText = `position:absolute;left:${16 + c * cell}px;top:${16 + r * cell}px;width:${cell}px;height:${cell}px;background:var(--ink)`; grid.firstChild.appendChild(d); cells.push({ d, r, c, fin: finder(r, c) }); }
  const inp = inG(0, `<div class="card" style="width:250px;height:48px;flex-direction:row;justify-content:flex-start;padding:0 16px;gap:10px;border-radius:12px"><span style="color:var(--soft)">${ic("link", 18)}</span><span class="mono qtxt" style="font-size:13px"></span></div>`);
  const qtxt = inp.querySelector(".qtxt");
  const btn = inG(2, `<div class="pill" style="display:flex;gap:8px;align-items:center;font-size:16px;padding:12px 22px">${ic("download", 18)} Save PNG</div>`);
  const file = inG(2, `<div class="card" style="width:96px;height:96px"><span style="color:var(--soft)">${ic("image", 30)}</span><b style="font-size:12px">qr.png</b></div>`);
  const ok = inG(2, `<div class="pill" style="display:flex;gap:6px;align-items:center">${ic("check", 16)} saved</div>`);
  const text = "tools4devs.app/get";
  return (t) => {
    const s = t, xo = exit(s, 1.72, 2.0);
    qtxt.textContent = text.slice(0, Math.floor(text.length * seg(s, .2, .95))) + (s % .6 < .3 && s < 1.1 ? "▌" : "");
    put(inp, { x: -150, y: -30, sx: lerp(.9, 1, E.out(seg(s, 0, .4))), sy: lerp(.9, 1, E.out(seg(s, 0, .4))), o: seg(s, 0, .2) });
    const gx = lerp(0, 0, 0);
    const styleK = E.inout(seg(t, 2.35, 3.3));
    const sO = t < 4.2 ? 1 : 1 - exit(t - 4.2, 1.62, 1.85);
    put(grid, { x: 130, y: 0, s: lerp(.9, 1, E.out(seg(s, .9, 1.4))), o: seg(s, .9, 1.1) * (t < 2.0 ? 1 - xo * 0 : 1) * sO });
    const cx = (N - 1) / 2;
    cells.forEach(({ d, r, c, fin }) => {
      const dist = Math.hypot(r - cx, c - cx);
      const pop = E.back(seg(s, 1.0 + dist * .028, 1.35 + dist * .028));
      d.style.transform = `scale(${pop})`; d.style.opacity = seg(s, 1.0 + dist * .028, 1.1 + dist * .028);
      d.style.background = styleK > 0 ? `color-mix(in oklab, var(--ink) ${100 - styleK * 100}%, oklch(0.55 0.2 ${HUE}) ${styleK * 100}%)` : "var(--ink)";
      d.style.borderRadius = fin ? `${styleK * 2}px` : `${styleK * 50}%`;
    });
    put(btn, { x: -150, y: 40, s: E.back(seg(t, 4.3, 4.7)) * (1 - .1 * Math.sin(Math.PI * seg(t, 4.95, 5.15))), o: seg(t, 4.3, 4.45) * (1 - seg(t, 5.3, 5.5) * 0) * (t < 5.35 ? 1 : 1 - seg(t, 5.35, 5.6)) });
    put(file, { x: lerp(130, 130, 0) + lerp(0, 0, 0), y: lerp(0, 0, 0) + lerp(0, 0, 0), o: 0 });
    put(file, { x: lerp(-150, 190, E.inout(seg(t, 5.05, 5.7))), y: lerp(40, 120, E.inout(seg(t, 5.05, 5.7))), s: .8, o: seg(t, 5.0, 5.12) * (1 - seg(t, 5.8, 5.95)) });
    put(ok, { x: -150, y: 40, s: E.back(seg(t, 5.5, 5.8)), o: seg(t, 5.5, 5.62) * (1 - seg(t, 5.85, 5.98)) });
    if (t >= 2.1) inp.style.opacity = t < 4.2 ? 1 : sO;
    if (t >= 4.2) inp.style.opacity = sO;
    if (t >= 5.9) grid.style.opacity = 1 - seg(t, 5.9, 6.0);
  };
};

// jq shares one persistent window across scenes: never hide groups for it
const keepAll = ID === "jq" || ID === "qr";
const step = CLIPS[ID]();
window.render = (t) => {
  t = t % D;
  chrome(t);
  groups.forEach((g, i) => (g.style.visibility = keepAll || i === scene(t) ? "visible" : "hidden"));
  step(t);
};
window.ready = document.fonts.ready.then(() => { window.render(0); return true; });
